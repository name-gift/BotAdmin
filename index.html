<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT KEY VIP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- CSS -->
  <link rel="stylesheet" href="botstyle.css">
</head>
<body>

<!-- LOGIN -->

<div class="login" id="loginBox">

<div class="logo">
🤖
</div>

<h2>BOT KEY VIP</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">
Đăng nhập
</button>

</div>

<!-- CHAT -->

<div class="chat" id="chatBox">

<!-- TOP -->

<div class="top">

<div class="topLeft">

<div class="avatar">
<img
id="botAvatar"
src="https://i.imgur.com/Z7AzH2c.jpg">
</div>

<div>
<b>BOT KEY VIP</b><br>
<small id="statusText">🟢 Online</small>
</div>

</div>

</div>

<!-- COMMANDS -->

<div class="cmds" id="cmds"></div>

<!-- MESSAGES -->

<div class="messages" id="messages"></div>

<!-- INPUT -->

<div class="inputBox">

<input id="msg" placeholder="Nhập lệnh...">

<button onclick="send()">
Gửi
</button>

</div>

</div>

<script>

// ===== API =====
const API =
"https://script.google.com/macros/s/AKfycbxsIJ5VEoZnuLxme1haWqnbDOlFMVANdBl3gsrX9p0oCFhK6GGh2dHPu7tAFP1kJd6N/exec";

// ROLE
let role = "user";

// MAINTENANCE
let maintenance =
localStorage.getItem("maintenance")
== "true";

if(maintenance){
statusText.innerHTML =
"🛠 Đang bảo trì";
}

// ENTER LOGIN
[user, pass].forEach(input => {

input.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){
login();
}

});

});

// ENTER SEND CHAT
msg.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){
send();
}

});

// ADD MESSAGE
function addMsg(text,type){

let div =
document.createElement("div");

div.className =
"msg " + type;

div.innerHTML = text;

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;
}

// RANDOM KEY
function randomKey(length = 16){

let chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

let result = "";

for(let i=0;i<length;i++){

result += chars.charAt(
Math.floor(
Math.random() * chars.length
)
);

}

return result;
}

function copyKey(key){

navigator.clipboard.writeText(key);

addMsg(`
✅ Đã copy key:<br><br>

<code>${key}</code>
`,"bot");

}

// LOGIN
async function login(){

let username =
user.value.trim();

let password =
pass.value.trim();

let res =
await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"login",
username,
password
})
});

let data =
await res.json();

if(data.status=="success"){

role = data.role;

loginBox.style.display =
"none";

chatBox.style.display =
"flex";

addMsg(`
✨ Xin chào <b>${username}</b>
`,"bot");

// ADMIN
if(role=="admin"){

cmds.innerHTML=`

<div class="cmdBtn"
onclick="autoAdd()">
/add
</div>

<div class="cmdBtn"
onclick="toggleMaintenance()">
🛠 Bảo trì
</div>

`;

addMsg(`

<div class="admin">

👑 ADMIN MODE<br><br>

Tạo key:<br>
<code>/add LINK 24</code><br><br>

Ví dụ:<br>
<code>/add https://google.com 24</code><br><br>

Key vĩnh viễn:<br>
<code>/add https://google.com</code>

</div>

`,"bot");

}

// USER
else{

cmds.innerHTML=`

<div class="cmdBtn"
onclick="autoStart()">
/start
</div>

`;

addMsg(`
🔑 Nhập key bằng lệnh:<br><br>

<code>/start KEY</code>
`,"bot");

}

}else{

alert("Sai tài khoản");

}

}

// AUTO
function autoAdd(){

msg.value="/add ";

msg.focus();
}

function autoStart(){

msg.value="/start ";

msg.focus();
}

// MAINTENANCE
function toggleMaintenance(){

maintenance = !maintenance;

localStorage.setItem(
"maintenance",
maintenance
);

statusText.innerHTML =
maintenance
? "🛠 Đang bảo trì"
: "🟢 Online";

addMsg(`
🛠 Chế độ bảo trì:
<b>
${maintenance ? "BẬT" : "TẮT"}
</b>
`,"bot");

}

// SEND
async function send(){

let text =
msg.value.trim();

if(text=="") return;

addMsg(text,"user");

msg.value="";

// ===== ADD =====
if(text.startsWith("/add")){

if(role!="admin"){

addMsg(`
❌ Bạn không phải admin
`,"bot");

return;
}

let parts =
text.split(" ");

if(parts.length < 2){

addMsg(`
❌ Sai cú pháp<br><br>

<code>/add LINK 24</code>
`,"bot");

return;
}

let link = parts[1];

let hours =
Number(parts[2]);

let key =
randomKey();

let expireDate;

// VĨNH VIỄN
if(!parts[2]){

expireDate = "never";

}

// CÓ GIỜ
else{

expireDate =
new Date();

expireDate.setHours(
expireDate.getHours() + hours
);

}

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"addKey",
key,
link,
expire:expireDate
})
});

addMsg(`

<div class="admin">

✅ TẠO KEY THÀNH CÔNG<br><br>

🔑 KEY:<br>

<div style="
display:flex;
align-items:center;
gap:10px;
margin-top:8px;
margin-bottom:15px;
">

<code id="key_${key}">
${key}
</code>

<button
onclick="copyKey('${key}')"
style="
padding:8px 14px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#00ff99,#00bfff);
color:#08111f;
font-weight:700;
cursor:pointer;
">
📋 Copy
</button>

</div>

🌐 LINK:<br>
${link}<br><br>

⏰ HẾT HẠN:<br>
${parts[2]
? hours + " giờ"
: "Vĩnh viễn"}

</div>

`,"bot");

}

// ===== START =====
else if(
text.startsWith("/start")
||
(role=="admin" && !text.startsWith("/add"))
){

if(maintenance){

addMsg(`
🛠 BOT ĐANG BẢO TRÌ
`,"bot");

return;
}

let key;

// ADMIN gửi thẳng key
if(role=="admin" && !text.startsWith("/start")){

key = text;

}

// USER dùng /start
else{

let parts =
text.split(" ");

if(parts.length < 2){

addMsg(`
❌ Vui lòng nhập key
`,"bot");

return;
}

key = parts[1];

}

let res =
await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"getKey",
key
})
});

let data =
await res.json();

if(data.status=="found"){

addMsg(`

✅ KEY HỢP LỆ<br><br>

🔑 <b>${key}</b><br><br>

⏰ ${
data.expire=="never"
? "Vĩnh viễn"
: new Date(data.expire)
.toLocaleString("vi-VN")
}<br><br>

<a href="${data.link}"
target="_blank"
style="
display:inline-block;
padding:12px 18px;
background:linear-gradient(45deg,#00ff99,#00bfff);
border-radius:12px;
color:#08111f;
font-weight:700;
">

👉 MỞ LINK

</a>

`,"bot");

}

else if(data.status=="expired"){

addMsg(`

<div style="color:#ff6b6b;">

❌ KEY ĐÃ HẾT HẠN<br><br>

🔑 <b>${key}</b><br><br>

<div style="
background:#3a1111;
padding:12px;
border-radius:12px;
text-align:center;
font-weight:bold;
color:#ff4d4d;
cursor:not-allowed;
">

🚫 LINK ĐÃ KHÓA

</div>

</div>

`,"bot");

}

else{

// CHECK ĐỘ DÀI KEY
if(text.length < 10){

addMsg(`
❌ Vui lòng nhập key hợp lệ
`,"bot");

}

}

}

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT KEY VIP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(180deg,#08111f,#0f1729,#0b1220);
height:100vh;
color:white;
overflow:hidden;
}

/* LOGIN */

.login{
width:360px;
background:#101827;
padding:30px;
border-radius:25px;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
box-shadow:0 0 40px rgba(0,191,255,0.15);
border:1px solid rgba(255,255,255,0.05);
}

.logo{
text-align:center;
font-size:42px;
margin-bottom:10px;
}

.login h2{
text-align:center;
margin-bottom:25px;
font-size:28px;
}

.login input{
width:100%;
padding:15px;
margin-top:14px;
border:none;
border-radius:15px;
background:#182235;
color:white;
outline:none;
font-size:15px;
}

.login button{
width:100%;
padding:15px;
margin-top:18px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#00bfff,#0066ff);
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.login button:hover{
transform:scale(1.03);
}

/* CHAT */

.chat{
display:none;
height:100vh;
flex-direction:column;
}

/* TOP */

.top{
padding:15px;
background:#101827;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topLeft{
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

/* COMMANDS */

.cmds{
display:flex;
gap:10px;
padding:12px;
background:#0f1729;
overflow:auto;
}

.cmdBtn{
background:#182235;
padding:12px 18px;
border-radius:14px;
cursor:pointer;
transition:.2s;
white-space:nowrap;
font-weight:600;
}

.cmdBtn:hover{
background:#00bfff;
}

/* MESSAGES */

.messages{
flex:1;
overflow:auto;
padding:15px;
}

.msg{
padding:15px;
margin:10px 0;
border-radius:18px;
max-width:80%;
line-height:1.6;
word-wrap:break-word;
animation:show .2s ease;
}

@keyframes show{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.bot{
background:#182235;
border-bottom-left-radius:6px;
}

.user{
margin-left:auto;
background:linear-gradient(45deg,#00bfff,#0066ff);
border-bottom-right-radius:6px;
}

/* INPUT */

.inputBox{
display:flex;
gap:10px;
padding:15px;
background:#101827;
}

.inputBox input{
flex:1;
padding:15px;
border:none;
border-radius:15px;
background:#182235;
color:white;
outline:none;
font-size:15px;
}

.inputBox button{
width:110px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#00bfff,#0066ff);
color:white;
font-weight:700;
cursor:pointer;
}

/* EXTRA */

.admin{
color:#7dffb3;
}

code{
background:#0f1729;
padding:5px 10px;
border-radius:10px;
display:inline-block;
margin-top:5px;
color:#7dffb3;
}

a{
text-decoration:none;
}

::-webkit-scrollbar{
width:5px;
}

::-webkit-scrollbar-thumb{
background:#00bfff;
border-radius:10px;
}

</style>
</head>
<body>

<!-- LOGIN -->

<div class="login" id="loginBox">

<div class="logo">
🤖
</div>

<h2>BOT KEY VIP</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">
Đăng nhập
</button>

</div>

<!-- CHAT -->

<div class="chat" id="chatBox">

<!-- TOP -->

<div class="top">

<div class="topLeft">

<div class="avatar">
<img
id="botAvatar"
src="https://i.imgur.com/Z7AzH2c.jpg">
</div>

<div>
<b>BOT KEY VIP</b><br>
<small id="statusText">🟢 Online</small>
</div>

</div>

</div>

<!-- COMMANDS -->

<div class="cmds" id="cmds"></div>

<!-- MESSAGES -->

<div class="messages" id="messages"></div>

<!-- INPUT -->

<div class="inputBox">

<input id="msg" placeholder="Nhập lệnh...">

<button onclick="send()">
Gửi
</button>

</div>

</div>

<script>

// ===== API =====
const API =
"https://script.google.com/macros/s/AKfycbxa6568yT8EIZ-Yl0axmK8VyBvieFC8GzEgspBPNwIvzCnVOw23paK6mUSpyofnS9Hr/exec";

// ROLE
let role = "user";

// MAINTENANCE
let maintenance =
localStorage.getItem("maintenance")
== "true";

if(maintenance){
statusText.innerHTML =
"🛠 Đang bảo trì";
}

// ENTER LOGIN
[user, pass].forEach(input => {

input.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){
login();
}

});

});

// ENTER SEND CHAT
msg.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){
send();
}

});

// ADD MESSAGE
function addMsg(text,type){

let div =
document.createElement("div");

div.className =
"msg " + type;

div.innerHTML = text;

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;
}

// RANDOM KEY
function randomKey(length = 16){

let chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

let result = "";

for(let i=0;i<length;i++){

result += chars.charAt(
Math.floor(
Math.random() * chars.length
)
);

}

return result;
}

// LOGIN
async function login(){

let username =
user.value.trim();

let password =
pass.value.trim();

let res =
await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"login",
username,
password
})
});

let data =
await res.json();

if(data.status=="success"){

role = data.role;

loginBox.style.display =
"none";

chatBox.style.display =
"flex";

addMsg(`
✨ Xin chào <b>${username}</b>
`,"bot");

// ADMIN
if(role=="admin"){

cmds.innerHTML=`

<div class="cmdBtn"
onclick="autoAdd()">
/add
</div>

<div class="cmdBtn"
onclick="toggleMaintenance()">
🛠 Bảo trì
</div>

`;

addMsg(`

<div class="admin">

👑 ADMIN MODE<br><br>

Tạo key:<br>
<code>/add LINK 24</code><br><br>

Ví dụ:<br>
<code>/add https://google.com 24</code><br><br>

Key vĩnh viễn:<br>
<code>/add https://google.com</code>

</div>

`,"bot");

}

// USER
else{

cmds.innerHTML=`

<div class="cmdBtn"
onclick="autoStart()">
/start
</div>

`;

addMsg(`
🔑 Nhập key bằng lệnh:<br><br>

<code>/start KEY</code>
`,"bot");

}

}else{

alert("Sai tài khoản");

}

}

// AUTO
function autoAdd(){

msg.value="/add ";

msg.focus();
}

function autoStart(){

msg.value="/start ";

msg.focus();
}

// MAINTENANCE
function toggleMaintenance(){

maintenance = !maintenance;

localStorage.setItem(
"maintenance",
maintenance
);

statusText.innerHTML =
maintenance
? "🛠 Đang bảo trì"
: "🟢 Online";

addMsg(`
🛠 Chế độ bảo trì:
<b>
${maintenance ? "BẬT" : "TẮT"}
</b>
`,"bot");

}

// SEND
async function send(){

let text =
msg.value.trim();

if(text=="") return;

addMsg(text,"user");

msg.value="";

// ===== ADD =====
if(text.startsWith("/add")){

if(role!="admin"){

addMsg(`
❌ Bạn không phải admin
`,"bot");

return;
}

let parts =
text.split(" ");

if(parts.length < 2){

addMsg(`
❌ Sai cú pháp<br><br>

<code>/add LINK 24</code>
`,"bot");

return;
}

let link = parts[1];

let hours =
Number(parts[2]);

let key =
randomKey();

let expireDate;

// VĨNH VIỄN
if(!parts[2]){

expireDate = "never";

}

// CÓ GIỜ
else{

expireDate =
new Date();

expireDate.setHours(
expireDate.getHours() + hours
);

}

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"addKey",
key,
link,
expire:expireDate
})
});

addMsg(`

<div class="admin">

✅ TẠO KEY THÀNH CÔNG<br><br>

🔑 KEY:<br>
<code>${key}</code><br><br>

🌐 LINK:<br>
${link}<br><br>

⏰ HẾT HẠN:<br>
${parts[2]
? hours + " giờ"
: "Vĩnh viễn"}

</div>

`,"bot");

}

// ===== START =====
else if(
text.startsWith("/start")
||
(role=="admin" && !text.startsWith("/add"))
){

if(maintenance){

addMsg(`
🛠 BOT ĐANG BẢO TRÌ
`,"bot");

return;
}

let key;

// ADMIN gửi thẳng key
if(role=="admin" && !text.startsWith("/start")){

key = text;

}

// USER dùng /start
else{

let parts =
text.split(" ");

if(parts.length < 2){

addMsg(`
❌ Vui lòng nhập key
`,"bot");

return;
}

key = parts[1];

}

let res =
await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"getKey",
key
})
});

let data =
await res.json();

if(data.status=="found"){

addMsg(`

✅ KEY HỢP LỆ<br><br>

🔑 <b>${key}</b><br><br>

⏰ ${
data.expire=="never"
? "Vĩnh viễn"
: data.expire
}<br><br>

<a href="${data.link}"
target="_blank"
style="
display:inline-block;
padding:12px 18px;
background:linear-gradient(45deg,#00ff99,#00bfff);
border-radius:12px;
color:#08111f;
font-weight:700;
">

👉 MỞ LINK

</a>

`,"bot");

}

else if(data.status=="expired"){

addMsg(`

<div style="color:#ff6b6b;">

❌ KEY ĐÃ HẾT HẠN<br><br>

🔑 <b>${key}</b><br><br>

<div style="
background:#3a1111;
padding:12px;
border-radius:12px;
text-align:center;
font-weight:bold;
color:#ff4d4d;
cursor:not-allowed;
">

🚫 LINK ĐÃ KHÓA

</div>

</div>

`,"bot");

}

else{

// CHECK ĐỘ DÀI KEY
if(text.length < 16){

addMsg(`
❌ Vui lòng nhập key hợp lệ
`,"bot");

}

}

}

}

</script>

</body>
</html>
